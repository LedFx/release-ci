[project]
name = "ledfx-release-ci"
version = "0.3.1"
description = "Verified release transactions for LedFx GitHub Actions"
requires-python = ">=3.11"
dependencies = []
license = "GPL-3.0-or-later"

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "ruff==0.16.10",
    "actionlint-py==1.7.12.24",
    "shellcheck-py==0.11.0.1",
    "zizmor==1.30.1",
    "prek>=0.5.3",
    "pyrefly==1.3.1",
    "cibuildwheel==4.2.1",
]

[tool.uv]
required-version = ">=0.12.12"
exclude-newer = "14 days"
default-groups = []
package = false

[tool.pyrefly]
preset = "strict"
python-platform = "linux"
project-includes = ["**/*.py", "**/*.pyi"]
search-path = ["."]

[tool.pyrefly.errors]
explicit-any = "error"

[tool.ruff.lint]
extend-select = ["ANN"]

[tool.pytest.ini_options]
testpaths = ["tests"]
