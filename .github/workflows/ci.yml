name: CI
on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  quality:
    name: Strict Python and workflow checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false
          python-version: '3.12'
      - run: uv run --frozen --only-group dev prek run --all-files
  tests:
    name: Offline contracts (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13', '3.14', '3.15']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false
          python-version: ${{ matrix.python }}
      - run: uv run --frozen --only-group dev python -m pytest -q
      - name: Composite rejects unauthorized publication before network or writes
        id: denied
        continue-on-error: true
        uses: ./actions/release
        with:
          phase: prepare
          project: tests/fixtures/planning/ledfx-senders
          dist: absent-distributions
          snapshot: ${{ runner.temp }}/unauthorized-snapshot.json
      - name: Require expected denial
        env:
          OUTCOME: ${{ steps.denied.outcome }}
        run: test "$OUTCOME" = failure
